<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111111">
    <title>Sem conexão · Ritmo</title>
    <style>
        body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; background: #F4F4F4; color: #111; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
        main { max-width: 340px; padding: 24px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; }
        img { width: 64px; height: 64px; border-radius: 16px; }
        h1 { margin: 0; font-size: 28px; text-transform: uppercase; letter-spacing: .5px; }
        p { margin: 0; color: #555; line-height: 1.5; font-size: 15px; }
        button { margin-top: 6px; height: 50px; padding: 0 22px; border: 0; border-radius: 16px; background: #D42A20; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <img src="/icons/icon-192.png" alt="">
        <h1>Sem conexão</h1>
        <p>Não conseguimos falar com o servidor. Confira a internet e tente de novo. Seus registros não se perdem.</p>
        <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
</body>
</html>
